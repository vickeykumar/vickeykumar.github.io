# ------------------------------------------------------------------
# vickeykumar.github.io
#
# Most of the page content lives in the _data folder:
#   _data/profile.yml      intro card, terminal, featured project
#   _data/experience.yml   work history
#   _data/skills.yml       skills
#   _data/credentials.yml  education, publications, certifications
# Repository stats (stars, forks, language) and your photo are pulled
# live from GitHub every time the site builds.
# ------------------------------------------------------------------

title: Vickey Kumar
tagline: Software Engineer, Networking & Cloud
description: >-
  Vickey Kumar is a Software Engineer IV at Cisco building scalable, efficient
  systems for networks and the cloud, and the creator of OpenREPL.
url: https://vickeykumar.github.io

plugins:
  - jekyll-github-metadata
  - jemoji

permalink: /:year/:month/:day/:title/

defaults:
  -
    scope:
      path: "" # an empty string here means all files in the project
      type: "posts"
    values:
      layout: "post"

exclude:
  - README.md
  - LICENSE.txt
  - Gemfile
  - Gemfile.lock
  - vendor

# Left sidebar. Anything left empty falls back to your GitHub profile.
profile:
  name: Vickey Kumar
  bio: 'Networking &amp; cloud · Creator of <a href="https://openrepl.com/">OpenREPL</a>'
  status: I’m a work in progress
  job_title: Software Engineer IV
  company: Software Engineer IV, Cisco Systems India Pvt. Ltd.
  employer: Cisco
  location: Bengaluru, India
  email: kumarvickey45@gmail.com
  badge: Please reach out to know more about me

# Start of your career (YYYY-MM). Used to work out "11+ years" automatically.
career_start: "2015-07"

projects:
  # Repositories shown under "My Projects", in this order.
  # Stars, forks and language come live from GitHub.
  include:
    - Go-interpreter
    - sish-lb
    - go-dsa
    - dsa
    - raspi-mgr
    - openrepl
  # Optional: replace a repository's GitHub description on this site.
  descriptions:
    Go-interpreter: A Python-based Go interpreter, like the Python shell, for writing and running small Go snippets.
    sish-lb: "An open source serveo/ngrok alternative: HTTP(S), WS(S) and TCP tunnels to localhost using only SSH, with load balancing."
    go-dsa: A Go module implementing common data structures and algorithms.
    dsa: Classic data structures implemented from scratch in C.
    raspi-mgr: A service to manage different utilities on a Raspberry Pi.
    openrepl: "The OpenREPL server: browser-based REPLs and terminals over WebSockets."

